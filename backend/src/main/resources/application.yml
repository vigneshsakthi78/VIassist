server:
  port: ${PORT:8080}

spring:
  application:
    name: langchain4j-rag-backend

# Google Gemini chat + embeddings (API-based; safe for small Render memory)
# Get a key: https://aistudio.google.com/apikey
langchain4j:
  google-ai-gemini:
    chat-model:
      api-key: ${GEMINI_API_KEY}
      model-name: ${GEMINI_MODEL:gemini-2.0-flash-lite}
      temperature: 0.2
      max-output-tokens: 2048
      max-retries: 2
      log-requests-and-responses: false
    embedding-model:
      api-key: ${GEMINI_API_KEY}
      # text-embedding-004 is not available on Gemini API v1beta embedContent
      model-name: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
      max-retries: 2
      log-requests-and-responses: false

rag:
  docs-path: ${DOCS_PATH:}
  # allowedOriginPatterns: wildcards ok (e.g. https://*.netlify.app)
  cors-origins: ${RAG_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://*.netlify.app}
