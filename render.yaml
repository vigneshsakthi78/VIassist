services:
  - type: web
    name: vicky-assist-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: RAG_CORS_ORIGINS
        sync: false
